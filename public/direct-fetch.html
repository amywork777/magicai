<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Direct Tripo Model Fetcher</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }
    .container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100%;
    }
    .status {
      padding: 10px;
      background-color: #0f172a;
      color: white;
      z-index: 100;
      text-align: center;
    }
    .viewer-container {
      flex: 1;
      position: relative;
    }
    model-viewer {
      width: 100%;
      height: 100%;
      background-color: #000;
    }
    .loading {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: rgba(0, 0, 0, 0.8);
      z-index: 10;
    }
    .error {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: rgba(0, 0, 0, 0.8);
      color: #f43f5e;
      z-index: 10;
      text-align: center;
      padding: 20px;
    }
    .hidden {
      display: none;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #06b6d4;
      animation: spin 1s linear infinite;
      margin-bottom: 1rem;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .btn {
      background-color: #06b6d4;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      margin-top: 1rem;
      cursor: pointer;
      font-weight: 500;
    }
    .btn:hover {
      background-color: #0891b2;
    }
  </style>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js" crossorigin="anonymous"></script>
</head>
<body>
  <div class="container">
    <div class="status" id="status">Initializing...</div>
    
    <div class="viewer-container">
      <model-viewer 
        id="viewer"
        camera-controls 
        auto-rotate
        shadow-intensity="1"
        shadow-softness="0.5"
        exposure="0.8"
        environment-image="neutral"
        style="display:none"
      ></model-viewer>
      
      <div id="loading" class="loading">
        <div class="spinner"></div>
        <div id="loadingText">Preparing to load model...</div>
      </div>
      
      <div id="error" class="error hidden">
        <h2>Error Loading Model</h2>
        <p id="errorMessage">Failed to load 3D model.</p>
        <div>
          <button class="btn" id="tryAgainBtn">Try Again</button>
          <button class="btn" id="downloadBtn" style="margin-left: 10px;">Download Model</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const viewer = document.getElementById('viewer');
      const loading = document.getElementById('loading');
      const error = document.getElementById('error');
      const status = document.getElementById('status');
      const loadingText = document.getElementById('loadingText');
      const errorMessage = document.getElementById('errorMessage');
      const tryAgainBtn = document.getElementById('tryAgainBtn');
      const downloadBtn = document.getElementById('downloadBtn');
      
      // Get model URL from query parameter or use default Tripo URL
      const urlParams = new URLSearchParams(window.location.search);
      const modelUrl = urlParams.get('url') || 'https://tripo-data.rg1.data.tripo3d.com/tcli_9270104da6f34a46a2479869119b834d/20250401/33534c84-421c-4d08-b255-32ea7ccaa66f/tripo_base_model_33534c84-421c-4d08-b255-32ea7ccaa66f.glb?Policy=eyJTdGF0ZW1lbnQiOlt7IlJlc291cmNlIjoiaHR0cHM6Ly90cmlwby1kYXRhLnJnMS5kYXRhLnRyaXBvM2QuY29tL3RjbGlfOTI3MDEwNGRhNmYzNGE0NmEyNDc5ODY5MTE5YjgzNGQvMjAyNTA0MDEvMzM1MzRjODQtNDIxYy00ZDA4LWIyNTUtMzJlYTdjY2FhNjZmL3RyaXBvX2Jhc2VfbW9kZWxfMzM1MzRjODQtNDIxYy00ZDA4LWIyNTUtMzJlYTdjY2FhNjZmLmdsYiIsIkNvbmRpdGlvbiI6eyJEYXRlTGVzc1RoYW4iOnsiQVdTOkVwb2NoVGltZSI6MTc0MzU1MjAwMH19fV19&Signature=M6KENdGTGxLDYFl5e4Dxrqd5ao~fnGNpSnLKFVpBteKEq4CT-osEcoxxnQkeYswt~63dl6EWNn6tQ9KHMsUb1ShaYFVc~X-NOmHpptpayupTZcWTXLkrdL5agIWHMcfkuHI9CuUufHlQfpHMzKblVS2Gohc8GRRIBtAkyR22gncB1iuaYDsnN9-Y-usj4ZAIY0YR1VonnycFaFSxBFrwoBUPi1JbsPs~a2avqWmg-mgGX7RxpMn2MLEIk05jJKpt87KxSuNNmY~mAsrBRr9inZqwGd~jNPttv6ibbb3Ylvsk5zsmAEPze77qOuQKEhun9rBdKj1tAIUunFZva4Q4qQ__&Key-Pair-Id=K1676C64NMVM2J';
      
      // Show loading state
      function showLoading(message) {
        loading.classList.remove('hidden');
        error.classList.add('hidden');
        loadingText.textContent = message;
      }
      
      // Show error state
      function showError(message) {
        loading.classList.add('hidden');
        error.classList.remove('hidden');
        errorMessage.textContent = message;
      }
      
      // Update status
      function updateStatus(message) {
        status.textContent = message;
      }
      
      // Main function to load model using XHR (avoids fetch CORS issues)
      function loadModelWithXHR() {
        showLoading('Downloading model...');
        updateStatus('Requesting model data...');
        
        const xhr = new XMLHttpRequest();
        xhr.open('GET', modelUrl, true);
        xhr.responseType = 'blob';
        
        // Set all headers that might help
        xhr.setRequestHeader('Accept', '*/*');
        xhr.setRequestHeader('Accept-Language', 'en-US,en;q=0.9');
        xhr.setRequestHeader('Origin', window.location.origin);
        xhr.setRequestHeader('Referer', window.location.origin);
        xhr.setRequestHeader('X-Requested-With', 'XMLHttpRequest');
        
        xhr.onprogress = function(event) {
          if (event.lengthComputable) {
            const percentComplete = Math.round((event.loaded / event.total) * 100);
            showLoading(`Downloading: ${percentComplete}%`);
            updateStatus(`Downloading model: ${percentComplete}%`);
          }
        };
        
        xhr.onload = function() {
          if (xhr.status === 200) {
            updateStatus('Model downloaded, loading viewer...');
            const blob = xhr.response;
            const objectUrl = URL.createObjectURL(blob);
            
            // Now set the model viewer source
            viewer.setAttribute('src', objectUrl);
            viewer.style.display = 'block';
            
            // Setup download link
            downloadBtn.onclick = function() {
              const a = document.createElement('a');
              a.href = objectUrl;
              a.download = 'tripo-model.glb';
              a.click();
            };
            
            // Listen for model load
            viewer.addEventListener('load', function onLoad() {
              loading.classList.add('hidden');
              updateStatus('Model loaded successfully');
              viewer.removeEventListener('load', onLoad);
            });
            
            // Listen for errors
            viewer.addEventListener('error', function onError(e) {
              console.error('Model viewer error:', e);
              showError('Error displaying the model, but the download was successful.');
              updateStatus('Error displaying model');
              viewer.removeEventListener('error', onError);
            });
          } else {
            console.error('XHR Error:', xhr.status, xhr.statusText);
            showError(`Failed to download model: ${xhr.status} ${xhr.statusText}`);
            updateStatus('Error loading model');
          }
        };
        
        xhr.onerror = function(e) {
          console.error('XHR Network Error:', e);
          showError('Network error while downloading model. Check your connection and try again.');
          updateStatus('Network error');
          
          // Try fallback method
          fallbackToProxy();
        };
        
        xhr.onabort = function() {
          showError('Model download was aborted.');
          updateStatus('Download aborted');
        };
        
        xhr.ontimeout = function() {
          showError('Model download timed out. The server might be slow or unresponsive.');
          updateStatus('Download timed out');
          
          // Try fallback method
          fallbackToProxy();
        };
        
        // Set timeout (10 seconds)
        xhr.timeout = 120000;
        
        // Send the request
        try {
          xhr.send();
        } catch (e) {
          console.error('Error sending XHR:', e);
          showError(`Error initiating download: ${e.message}`);
          updateStatus('Error starting download');
          
          // Try fallback method
          fallbackToProxy();
        }
      }
      
      // Fallback to proxy if direct XHR fails
      function fallbackToProxy() {
        showLoading('Trying server proxy...');
        updateStatus('Using server proxy to download model...');
        
        const proxyUrl = `/api/proxy-model?url=${encodeURIComponent(modelUrl)}`;
        
        fetch(proxyUrl)
          .then(response => {
            if (!response.ok) {
              throw new Error(`Proxy error: ${response.status} ${response.statusText}`);
            }
            return response.blob();
          })
          .then(blob => {
            const objectUrl = URL.createObjectURL(blob);
            
            viewer.setAttribute('src', objectUrl);
            viewer.style.display = 'block';
            
            downloadBtn.onclick = function() {
              const a = document.createElement('a');
              a.href = objectUrl;
              a.download = 'tripo-model.glb';
              a.click();
            };
            
            viewer.addEventListener('load', function onLoad() {
              loading.classList.add('hidden');
              updateStatus('Model loaded successfully via proxy');
              viewer.removeEventListener('load', onLoad);
            });
            
            viewer.addEventListener('error', function onError(e) {
              console.error('Model viewer error with proxy:', e);
              showError('Error displaying the model, but the proxy download was successful.');
              updateStatus('Error displaying model');
              viewer.removeEventListener('error', onError);
            });
          })
          .catch(e => {
            console.error('Proxy fetch error:', e);
            showError(`Both direct and proxy model loading failed: ${e.message}`);
            updateStatus('All loading methods failed');
          });
      }
      
      // Try again button
      tryAgainBtn.addEventListener('click', function() {
        loadModelWithXHR();
      });
      
      // Start loading process
      loadModelWithXHR();
    });
  </script>
</body>
</html>
